<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Growth Dashboard Admin — AR Plastic Surgery</title>
<style>
  :root{ --navy:#0B2447; --blue:#2563eb; --bg:#f5f7fa; --line:#e2e8f0; --ink:#1e293b; --mut:#64748b; --bad:#b91c1c; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  header.top{ text-align:center; margin-bottom:18px; }
  header.top h1{ font-size:1.25rem; margin:0; color:var(--navy); }
  header.top p{ margin:2px 0 0; color:var(--mut); font-size:.85rem; }
  /* Animated logo: a sparkle orbits the circle for as long as the page stays open */
  .logoStage{ position:relative; width:132px; height:132px; margin:4px auto 14px; }
  .logoStage .ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(11,36,71,.16); box-shadow:0 0 0 6px rgba(201,162,75,.10); }
  .logoStage img{ width:132px; height:132px; border-radius:50%; display:block; box-shadow:0 10px 30px rgba(11,36,71,.20); }
  .logoStage .orbit{ position:absolute; inset:-16px; border-radius:50%; animation:pwgSpin 5s linear infinite; pointer-events:none; }
  .logoStage .spark{ position:absolute; top:0; left:50%; transform:translate(-50%,-50%); font-size:21px; line-height:1; color:#c9a24b; text-shadow:0 0 8px rgba(201,162,75,.95), 0 0 20px rgba(201,162,75,.65); animation:pwgTwinkle 1.1s ease-in-out infinite; }
  .logoStage .spark.s2{ top:auto; bottom:0; transform:translate(-50%,50%); font-size:14px; animation-delay:.55s; }
  @keyframes pwgSpin{ to{ transform:rotate(360deg); } }
  @keyframes pwgTwinkle{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; box-shadow:0 1px 2px rgba(11,36,71,.04); }
  .hidden{ display:none !important; }
  label{ display:block; font-size:.85rem; font-weight:600; margin-bottom:6px; color:var(--navy); }
  input[type=password]{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; }
  .btn{ display:inline-block; background:var(--blue); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:.95rem; font-weight:600; cursor:pointer; margin-top:14px; }
  .status{ margin-top:12px; font-size:.9rem; min-height:1.2em; color:var(--bad); }
  .empty{ text-align:center; color:var(--mut); padding:36px 10px; font-size:.95rem; }
  a{ color:var(--blue); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logoStage" aria-hidden="true">
      <div class="ring"></div>
      <img src="logo.png" alt="AR Plastic Surgery logo">
      <div class="orbit"><span class="spark">✦</span><span class="spark s2">✦</span></div>
    </div>
    <h1>Growth Dashboard Admin</h1>
    <p>growth.arplasticsurgery.co.in — protected area.</p>
  </header>

  <section id="loginCard" class="card">
    <label for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Enter password">
    <button class="btn" id="loginBtn">Open admin</button>
    <div class="status" id="loginStatus"></div>
  </section>

  <section id="panelCard" class="card hidden">
    <div class="empty">Admin panel</div>
  </section>
</div>

<script>
var ADMIN_PASSWORD = '9696';
function $(id){ return document.getElementById(id); }
function tryOpen(){
  if ($('pw').value === ADMIN_PASSWORD) {
    $('loginCard').classList.add('hidden');
    $('panelCard').classList.remove('hidden');
  } else {
    $('loginStatus').textContent = 'Wrong password.';
  }
}
$('loginBtn').addEventListener('click', tryOpen);
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryOpen(); });
</script>
</body>
</html>
